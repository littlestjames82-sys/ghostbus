name: Publish to npm
# Publishes via npm Trusted Publishing (OIDC) — no npm token stored anywhere.
# One-time setup by the repo owner on npmjs.com:
#   npm package "ghostbus" (created by a first manual publish) ->
#   Settings -> Trusted Publisher -> GitHub Actions ->
#   owner: littlestjames82-sys, repo: ghostbus, workflow: publish-npm.yml,
#   environment: npm
# Until that publisher exists, run this workflow only in "dry" mode: it packs
# and verifies the tarball without publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry:
        description: "Pack only, do not publish"
        type: boolean
        default: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      # Third-party actions are pinned to full commit SHAs (v0.5.8) — a
      # retagged or compromised tag cannot change what runs here. The
      # trailing comment is the release the SHA was resolved from; bump
      # both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm@latest is deliberate, not lazy: npm Trusted Publishing (OIDC)
      # requires npm >= 11.5.1, newer than the npm bundled with the
      # runner's Node. Pinning an older npm would break the publish.
      - run: npm install -g npm@latest
      - run: node test.mjs
      - name: Pack (always — this is the verification)
        run: npm pack --dry-run
      - name: Pack manifest allowlist (nothing unexpected ever ships)
        run: node scripts/check-pack.mjs
      - name: Publish (release events, or manual with dry=false)
        if: github.event_name == 'release' || inputs.dry == false
        run: npm publish --provenance --access public
