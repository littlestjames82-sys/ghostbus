name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test.mjs
      - run: node examples/two-agent-demo.mjs > /dev/null
      - run: node examples/three-agent-team.mjs > /dev/null
      - run: node deploy/netlify/test-lib.mjs
