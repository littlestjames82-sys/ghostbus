name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      # Actions pinned to full commit SHAs — same pins as publish-npm.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node test.mjs
      - run: node examples/two-agent-demo.mjs > /dev/null
      - run: node examples/three-agent-team.mjs > /dev/null
      - run: node deploy/netlify/test-lib.mjs
