name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      # Actions pinned to full commit SHAs — same pins as publish-npm.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node test.mjs
      - run: node examples/two-agent-demo.mjs > /dev/null
      - run: node examples/three-agent-team.mjs > /dev/null
      - run: node deploy/netlify/test-lib.mjs
